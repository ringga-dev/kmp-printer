name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - README.md
      - docs/**
      - webside/content/**
      - gradle.properties
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site from Markdown
        shell: bash
        run: |
          pip install markdown --quiet --break-system-packages 2>/dev/null || pip install markdown --quiet

          mkdir -p site/docs
          python3 <<'PY'
          from html import escape
          from pathlib import Path
          import markdown
          import re

          sources = [Path("README.md")] + sorted(Path("docs").glob("*.md"))

          md_extensions = [
              "extra",           # tables, code blocks, footnotes, etc.
              "sane_lists",      # proper list behavior
              "smarty",          # smart quotes
              "toc",             # table of contents
              "nl2br",           # newline to <br>
          ]

          def render_markdown(path: Path) -> str:
              text = path.read_text(encoding="utf-8")
              return markdown.markdown(text, extensions=md_extensions)

          def page(title: str, body: str, nav: str) -> str:
              return f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{escape(title)}</title>
            <style>
              :root {{
                color-scheme: dark;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --line: #334155;
                --bg: #0f172a;
                --panel: #1e293b;
                --accent: #2dd4bf;
                --code: #0b1120;
                --accent-dim: #14b8a6;
              }}
              * {{ box-sizing: border-box; }}
              body {{
                margin: 0;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                color: var(--text);
                background: var(--bg);
                line-height: 1.65;
              }}
              header {{
                background: var(--panel);
                border-bottom: 1px solid var(--line);
              }}
              .wrap {{
                width: min(100%, 1040px);
                margin: 0 auto;
                padding: 28px 20px;
              }}
              main.wrap {{
                background: var(--panel);
                margin-top: 24px;
                margin-bottom: 48px;
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 34px 28px;
              }}
              nav a {{ margin-right: 14px; }}
              h1, h2, h3 {{
                line-height: 1.2;
                letter-spacing: 0;
                margin: 28px 0 12px;
              }}
              h1 {{ font-size: 2.35rem; margin-top: 0; }}
              h2 {{ font-size: 1.45rem; border-top: 1px solid var(--line); padding-top: 24px; }}
              h3 {{ font-size: 1.1rem; }}
              p, ul, ol, table, pre {{ margin: 0 0 18px; }}
              a {{ color: var(--accent); text-decoration-thickness: 1px; }}
              a:hover {{ color: var(--accent-dim); }}
              img {{ max-width: 100%; height: auto; }}
              code {{
                background: #1e293b;
                border: 1px solid #334155;
                padding: 0.12rem 0.32rem;
                border-radius: 5px;
                font-size: 0.92em;
                color: #e2e8f0;
              }}
              pre {{
                background: var(--code);
                color: #eef5ff;
                overflow-x: auto;
                padding: 18px;
                border-radius: 8px;
              }}
              pre code {{
                background: transparent;
                border: 0;
                padding: 0;
                color: inherit;
              }}
              table {{
                width: 100%;
                border-collapse: collapse;
                display: block;
                overflow-x: auto;
                margin-bottom: 18px;
              }}
              th, td {{
                border: 1px solid var(--line);
                padding: 10px 12px;
                text-align: left;
              }}
              th {{ background: #1a2332; }}
              thead th {{ border-bottom: 2px solid var(--accent); }}
              blockquote {{
                border-left: 4px solid var(--accent);
                margin: 0 0 18px;
                padding: 8px 16px;
                background: #1a2332;
                border-radius: 0 6px 6px 0;
              }}
              blockquote p {{ margin: 0; }}
              hr {{ border: 0; border-top: 2px solid var(--line); margin: 28px 0; }}
              ul, ol {{ padding-left: 24px; }}
              li {{ margin-bottom: 4px; }}
              .subtle {{ color: var(--muted); margin: 0; }}
              main h1:first-of-type {{ text-align: center; font-size: 2.8rem; }}
              main h1:first-of-type + p {{ text-align: center; font-size: 1.1rem; }}
              main h1:first-of-type + p + p {{ text-align: center; }}
              main h1:first-of-type + p + p a {{ display: inline-block; margin: 2px; }}
            </style>
          </head>
          <body>
            <header>
              <div class="wrap">
                <h1 style="margin:0; font-size:1.6rem; display:inline-block;">KmpPrinter</h1>
                <span class="subtle" style="margin-left:10px;">Kotlin Multiplatform ESC/POS thermal printing library</span>
                <p class="subtle" style="margin:4px 0 0;"><nav>{nav}</nav></p>
              </div>
            </header>
            <main class="wrap">{body}</main>
          </body>
          </html>"""

          nav = '<a href="/kmp-printer/">README</a>' + ''.join(
              f' <a href="/kmp-printer/docs/{p.stem}.html">{escape(p.stem.replace("-", " ").title())}</a>'
              for p in sources[1:]
          )

          for source in sources:
              title = "KmpPrinter Documentation" if source.name == "README.md" else source.stem.replace("-", " ").title()
              target = Path("site/index.html") if source.name == "README.md" else Path("site/docs") / f"{source.stem}.html"
              target.write_text(page(title, render_markdown(source), nav), encoding="utf-8")

          Path("site/.nojekyll").write_text("", encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
