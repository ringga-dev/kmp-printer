name: Unified Library Publishing

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - gradle.properties
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  check:
    name: Test and Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM tests
        run: ./gradlew :printer:jvmTest --no-daemon

      - name: Compile KMP targets
        run: ./gradlew :printer:compileKotlinMetadata :printer:compileKotlinJs :printer:compileKotlinWasmJs --no-daemon

      - name: Compile Android target
        run: ./gradlew :printer:compileDebugKotlinAndroid --no-daemon

  setup:
    name: Read Version
    needs: check
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.version.outputs.lib_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read LIB_VERSION
        id: version
        shell: bash
        run: |
          version="$(grep '^LIB_VERSION=' gradle.properties | cut -d'=' -f2 | tr -d '\\r' | xargs)"
          if [ -z "$version" ]; then
            echo "LIB_VERSION is missing" >&2
            exit 1
          fi
          echo "lib_version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version
        shell: bash
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.lib_version }}"
          if [ "$tag" != "$version" ]; then
            echo "❌ Tag mismatch!"
            echo "   Tag:        ${GITHUB_REF_NAME} (v$tag)"
            echo "   LIB_VERSION: $version"
            echo ""
            echo "Fix: update LIB_VERSION in gradle.properties to match the tag"
            exit 1
          fi
          echo "✅ Tag v$tag matches LIB_VERSION $version"

  build-android:
    name: Build Android AAR
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build AAR
        run: ./gradlew :printer:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: kmp_printer-aar
          path: printer/build/outputs/aar/kmp_printer-release.aar
          if-no-files-found: error

  build-ios:
    name: Build iOS XCFramework
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build XCFramework
        run: ./gradlew :printer:assembleKmpPrinterXCFramework --no-daemon

      - name: Zip XCFramework
        shell: bash
        run: |
          cd printer/build/XCFrameworks/release
          zip -r ../../../KmpPrinter.xcframework.zip KmpPrinter.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: kmp_printer-xcframework
          path: printer/KmpPrinter.xcframework.zip
          if-no-files-found: error

  build-jvm:
    name: Build JVM Jar
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JVM Jar
        run: ./gradlew :printer:jvmJar --no-daemon

      - name: Upload JVM Jar
        uses: actions/upload-artifact@v4
        with:
          name: kmp_printer-jvm
          path: printer/build/libs/kmp_printer-jvm-*.jar
          if-no-files-found: error

  deploy-github-maven:
    name: 🐙 Deploy to GitHub Maven
    needs:
      - setup
      - build-android
      - build-jvm
      - build-ios
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate Maven repository
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: ./gradlew :printer:publishAllPublicationsToLocalRepoRepository --no-daemon

      - name: Create Sonatype bundle
        shell: bash
        run: |
          bundle_name="sonatype-bundle-${{ needs.setup.outputs.lib_version }}.zip"
          cd printer/build/repo
          zip -r -X "../../../$bundle_name" .
          zip -d "../../../$bundle_name" "__MACOSX*" "*.DS_Store*" || true

      - name: Deploy to maven-repo branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: maven-repo
          folder: printer/build/repo
          target-folder: .
          clean: false
          commit-message: Publish v${{ needs.setup.outputs.lib_version }} to GitHub Maven

      - name: Upload Sonatype bundle
        uses: actions/upload-artifact@v4
        with:
          name: sonatype-central-bundle
          path: sonatype-bundle-${{ needs.setup.outputs.lib_version }}.zip
          if-no-files-found: error

  deploy-maven-central:
    name: 📦 Deploy to Maven Central
    needs:
      - setup
      - deploy-github-maven
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: sonatype-central-bundle

      - name: Upload to Maven Central Portal
        shell: bash
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          bundle_zip="sonatype-bundle-${{ needs.setup.outputs.lib_version }}.zip"
          echo "Uploading $bundle_zip to Maven Central..."
          curl -s -X POST \
            -u "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" \
            -F "bundle=@${bundle_zip}" \
            "https://central.sonatype.com/api/v1/publisher/upload" | tee response.json
          echo ""
          echo "✅ Uploaded! Check: https://central.sonatype.com/publishing/status"

  create-release:
    name: Create GitHub Release
    needs:
      - setup
      - build-android
      - build-ios
      - build-jvm
      - deploy-github-maven
    runs-on: ubuntu-latest
    if: needs.deploy-github-maven.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.lib_version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.setup.outputs.lib_version }}
          files: |
            release_artifacts/kmp_printer-aar/**/*
            release_artifacts/kmp_printer-xcframework/**/*
            release_artifacts/kmp_printer-jvm/**/*
            release_artifacts/sonatype-central-bundle/**/*
          body: |
            ## KmpPrinter v${{ needs.setup.outputs.lib_version }}

            Kotlin Multiplatform ESC/POS thermal printing library for Android, iOS, JVM/Desktop, JS, and Wasm.

            ### 📦 Maven Central (soon)

            ```kotlin
            implementation("io.github.ringga-dev:kmp_printer:${{ needs.setup.outputs.lib_version }}")
            ```

            ### 🐙 GitHub Maven

            ```kotlin
            repositories {
                maven { url = uri("https://raw.githubusercontent.com/ringga-dev/kmp-printer/maven-repo") }
            }
            dependencies {
                implementation("io.github.ringga-dev:kmp_printer:${{ needs.setup.outputs.lib_version }}")
            }
            ```
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
