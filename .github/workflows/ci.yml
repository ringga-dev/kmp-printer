name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  printer:
    name: Printer KMP Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests
        run: ./gradlew :printer:jvmTest
      - name: KMP compile matrix
        run: ./gradlew :printer:compileKotlinMetadata :printer:compileKotlinJs :printer:compileKotlinWasmJs

  android:
    name: Android Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android compile
        run: ./gradlew :printer:compileReleaseKotlinAndroid :shared:compileReleaseKotlinAndroid :androidApp:compileReleaseKotlinAndroid

  desktop:
    name: Desktop Sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop jar
        run: ./gradlew :desktopApp:jvmJar
