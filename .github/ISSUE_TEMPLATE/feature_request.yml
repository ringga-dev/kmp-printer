name: Feature Request
description: Suggest an idea for this project
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe your idea clearly.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem would this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform should this target?
      multiple: true
      options:
        - Android
        - iOS
        - JVM / Desktop
        - Web / JS
        - Wasm
        - All Platforms

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots
